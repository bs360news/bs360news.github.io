<script>
document.addEventListener("DOMContentLoaded", function () {

    "use strict";

    const currentPage = "bhumrha.html";

    function getTitle(post) {
        const title = post.querySelector(".news-content p");
        return title ? title.textContent.trim() : "";
    }

    function getImage(post) {
        const img = post.querySelector("img");
        return img ? img.getAttribute("src") : "";
    }

    function getCategory(post) {
        return (post.dataset.category || "").toLowerCase().trim();
    }

    function getUrl(post) {
        return post.dataset.url || "#";
    }

    function makeSidebarItem(post) {

        const title = getTitle(post);
        const image = getImage(post);
        const url = getUrl(post);

        if (!title || url === "#") return "";

        return `
            <a href="${url}" class="sidebar-item">

                ${image ? `
                    <img
                        src="${image}"
                        class="sidebar-thumb"
                        alt=""
                    >
                ` : ""}

                <div class="sidebar-text">
                    ${title}
                </div>

            </a>
        `;
    }

    function makeMostReadItem(post, index) {

        const title = getTitle(post);
        const url = getUrl(post);

        if (!title || url === "#") return "";

        return `
            <a href="${url}" class="most-read-item">

                <div class="most-number">
                    ${index + 1}
                </div>

                <div class="most-title">
                    ${title}
                </div>

            </a>
        `;
    }

    function makeNewsCard(post) {

        const title = getTitle(post);
        const image = getImage(post);
        const url = getUrl(post);

        if (!title || url === "#") return "";

        return `
            <a href="${url}" class="news-card">

                ${image ? `
                    <img
                        src="${image}"
                        alt=""
                        loading="lazy"
                    >
                ` : ""}

                <div class="news-card-content">

                    <div class="news-card-title">
                        ${title}
                    </div>

                </div>

            </a>
        `;
    }

    function renderSidebar(posts) {

        const trendingBox =
            document.getElementById("trendingSidebar");

        const latestBox =
            document.getElementById("latestSidebar");

        const mostReadBox =
            document.getElementById("mostReadSidebar");

        if (!trendingBox || !latestBox || !mostReadBox) {
            return;
        }

        /*
         * Current article remove
         */
        const otherPosts = posts.filter(post => {

            return getUrl(post) !== currentPage;

        });

        /*
         * TRENDING
         */
        trendingBox.innerHTML =
            otherPosts
                .slice(0, 5)
                .map(makeSidebarItem)
                .join("");

        /*
         * LATEST
         */
        latestBox.innerHTML =
            otherPosts
                .slice(0, 5)
                .map(makeSidebarItem)
                .join("");

        /*
         * MOST READ
         *
         * మీ index.htmlలో actual read-count data లేదు.
         * కాబట్టి ప్రస్తుతం available articles నుంచే చూపిస్తున్నాం.
         */
        mostReadBox.innerHTML =
            otherPosts
                .slice(0, 5)
                .map((post, index) =>
                    makeMostReadItem(post, index)
                )
                .join("");
    }


    /*
     * ================================
     * MOVIES
     * ================================
     */

    function renderMovies(posts) {

        const box =
            document.getElementById("moviesGrid");

        if (!box) return;

        const movies =
            posts.filter(post => {

                return getCategory(post) === "cinema";

            });

        box.innerHTML =
            movies
                .slice(0, 4)
                .map(makeNewsCard)
                .join("");
    }


    /*
     * ================================
     * SPORTS
     * ================================
     */

    function renderSports(posts) {

        const box =
            document.getElementById("sportsGrid");

        if (!box) return;

        const sports =
            posts.filter(post => {

                return getCategory(post) === "sports";

            });

        box.innerHTML =
            sports
                .filter(post =>
                    getUrl(post) !== currentPage
                )
                .slice(0, 4)
                .map(makeNewsCard)
                .join("");
    }


    /*
     * ================================
     * LATEST ARTICLES
     * ================================
     */

    function renderLatest(posts) {

        const box =
            document.getElementById("latestGrid");

        if (!box) return;

        const latest =
            posts.filter(post =>
                getUrl(post) !== currentPage
            );

        box.innerHTML =
            latest
                .slice(0, 4)
                .map(makeNewsCard)
                .join("");
    }


    /*
     * ================================
     * LOAD INDEX ARTICLES
     * ================================
     */

    async function loadNews() {

        try {

            const response =
                await fetch("index.html");

            if (!response.ok) {

                console.log(
                    "index.html load failed"
                );

                return;
            }

            const html =
                await response.text();

            const parser =
                new DOMParser();

            const doc =
                parser.parseFromString(
                    html,
                    "text/html"
                );


            /*
             * IMPORTANT:
             * మీ index.htmlలో articles
             * #legacyNewsSource లో ఉన్నాయి.
             */

            const posts =
                Array.from(
                    doc.querySelectorAll(
                        "#legacyNewsSource article.post"
                    )
                );


            console.log(
                "Articles found:",
                posts.length
            );


            /*
             * SIDEBAR
             */

            renderSidebar(posts);


            /*
             * BOTTOM ARTICLES
             */

            renderMovies(posts);

            renderSports(posts);

            renderLatest(posts);

        } catch (error) {

            console.error(
                "News loading error:",
                error
            );

        }

    }


    loadNews();

});
</script>
