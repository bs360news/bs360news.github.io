<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suresh 360 Media</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="navbar">
        <div class="logo">Suresh 360 <span>Media</span></div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">News</a></li>
                <li><a href="#">Entertainment</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Banner Section -->
    <section class="hero">
        <h1>Welcome to Suresh 360 Media</h1>
        <p>లేటెస్ట్ వార్తలు, అప్‌డేట్స్ మరియు ట్రెండింగ్ విశేషాలు మీ కోసం!</p>
    </section>

    <!-- Posts Grid Section -->
    <main class="container">
        <h2 class="section-title">Latest Posts</h2>
        <div class="posts-grid" id="posts-container">
            <!-- Posts will be generated dynamically by JavaScript -->
        </div>
    </main>

    <!-- Read More Modal (పాల్ ఓపెన్ అయ్యే విండో) -->
    <div id="post-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modal-img" src="" alt="Post Image">
            <h2 id="modal-title"></h2>
            <div class="meta" id="modal-date"></div>
            <p id="modal-body"></p>
        </div>
    </div>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 Suresh 360 Media. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
