<div id="posts-container"></div>

<input
    type="text"
    id="search-input"
    placeholder="🔍 వార్తలు సెర్చ్ చేయండి..."
    oninput="searchPosts()"
>

<div id="post-modal">

    <div class="modal-content">

        <button onclick="closeModal()">
            ✕
        </button>

        <h2 id="modal-title"></h2>

        <img id="modal-img">

        <p id="modal-date"></p>

        <div id="modal-body"></div>

        <h3>Related News</h3>

        <div id="related-posts"></div>

    </div>

</div>
