<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suresh 360 Media</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="navbar">

        <div class="nav-container">

            <div class="logo">
                Suresh 360 <span>Media</span>
            </div>

            <nav>
                <ul>

                    <li>
                        <a href="#"
                           onclick="filterPosts('all'); return false;">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="#"
                           onclick="filterPosts('news'); return false;">
                            News
                        </a>
                    </li>

                    <li>
                        <a href="#"
                           onclick="filterPosts('sports'); return false;">
                            Sports
                        </a>
                    </li>

                    <li>
                        <a href="#"
                           onclick="filterPosts('movies'); return false;">
                            Movies
                        </a>
                    </li>

                    <li>
                        <a href="#"
                           onclick="filterPosts('technology'); return false;">
                            Technology
                        </a>
                    </li>

                </ul>
            </nav>

        </div>

    </header>


    <!-- SEARCH -->
    <section class="search-section">

        <div class="search-container">

            <input
                type="text"
                id="search-input"
                class="search-box"
                placeholder="🔍 వార్తలు లేదా సినిమాల కోసం సెర్చ్ చేయండి..."
                oninput="searchPosts()"
            >

        </div>

    </section>


    <!-- MAIN CONTENT -->
    <main class="container">

        <div class="section-heading-row">

            <h2 class="section-title">
                Latest Updates
            </h2>

            <button
                class="show-all-btn"
                onclick="filterPosts('all')">
                All Posts
            </button>

        </div>


        <!-- POSTS ARE GENERATED BY script.js -->
        <div
            class="posts-grid"
            id="posts-container">
        </div>

    </main>


    <!-- ARTICLE MODAL -->
    <div
        id="post-modal"
        class="modal"
        aria-hidden="true">

        <div class="modal-content">

            <button
                class="modal-close"
                onclick="closeModal()"
                aria-label="Close">

                &times;

            </button>


            <img
                id="modal-img"
                class="modal-image"
                src=""
                alt=""
            >


            <div class="modal-body-wrap">

                <span
                    id="modal-category"
                    class="modal-category">
                </span>


                <h2 id="modal-title"></h2>


                <p
                    id="modal-date"
                    class="modal-date">
                </p>


                <div
                    id="modal-body"
                    class="modal-article">
                </div>


                <div class="share-row">

                    <button onclick="sharePost()">
                        📤 Share
                    </button>

                </div>


                <h3 class="related-title">
                    Related Posts
                </h3>


                <div
                    id="related-posts"
                    class="related-posts">
                </div>

            </div>

        </div>

    </div>


    <!-- FOOTER -->
    <footer>

        <div class="footer-content">

            <div class="footer-info">

                <h3>
                    Suresh 360 Media
                </h3>

                <p>
                    News • Sports • Movies • Entertainment
                </p>

            </div>


            <div class="footer-email">

                📧 Contact Us:

                <a href="mailto:suresh360media@gmail.com">
                    suresh360media@gmail.com
                </a>

            </div>

        </div>


        <div class="copyright">

            &copy; 2026 Suresh 360 Media.
            All rights reserved.

        </div>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
